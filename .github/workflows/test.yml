name: 30-Kerzen BTC Bot - Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Show repository files
        run: |
          echo "=== REPOSITORY ==="
          pwd
          echo
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Test config
        run: |
          echo "=== CONFIG TEST ==="
          python config.py

      - name: Test signals
        run: |
          echo "=== SIGNAL TEST ==="
          python signals.py

      - name: Download and validate BTC 5m data
        run: |
          echo "=== MARKET DATA TEST ==="
          python market_data.py

      - name: Check generated CSV
        run: |
          echo "=== CSV CHECK ==="

          if [ -f "data/BTC_USD_5m.csv" ]; then
            echo "CSV gefunden."
            echo
            echo "Zeilen:"
            wc -l data/BTC_USD_5m.csv
            echo
            echo "Erste Zeilen:"
            head -5 data/BTC_USD_5m.csv
            echo
            echo "Letzte Zeilen:"
            tail -5 data/BTC_USD_5m.csv
          else
            echo "FEHLER: CSV wurde nicht erzeugt."
            exit 1
          fi

      - name: Run historical backtest
        run: |
          echo "=== BACKTEST START ==="

          if [ ! -f "backtest.py" ]; then
            echo "FEHLER: backtest.py wurde nicht gefunden."
            exit 1
          fi

          python backtest.py

          echo "=== BACKTEST ENDE ==="

      - name: Run historical analysis
        run: |
          echo "=== ANALYSIS START ==="

          if [ ! -f "analysis.py" ]; then
            echo "FEHLER: analysis.py wurde nicht gefunden."
            exit 1
          fi

          python analysis.py

          echo "=== ANALYSIS ENDE ==="

      - name: Run forward return analysis
        run: |
          echo "=== FORWARD ANALYSIS START ==="

          if [ ! -f "forward_analysis.py" ]; then
            echo "FEHLER: forward_analysis.py wurde nicht gefunden."
            exit 1
          fi

          python forward_analysis.py

          echo "=== FORWARD ANALYSIS ENDE ==="

      - name: Run 2/3/5/10 candle series backtest
        run: |
          echo "=== SIGNAL SERIES BACKTEST START ==="

          if [ ! -f "independent_backtest.py" ]; then
            echo "FEHLER: independent_backtest.py wurde nicht gefunden."
            exit 1
          fi

          python independent_backtest.py

          echo "=== SIGNAL SERIES BACKTEST ENDE ==="

      - name: Final status
        run: |
          echo
          echo "============================================================"
          echo "30-KERZEN BTC BOT - GESAMTTEST ABGESCHLOSSEN"
          echo "============================================================"
          echo
          echo "Config:                       OK"
          echo "Signals:                      OK"
          echo "Market Data:                  OK"
          echo "CSV:                          OK"
          echo "Backtest:                     OK"
          echo "Historical Analysis:          OK"
          echo "Forward Analysis:             OK"
          echo "2/3/5/10 Candle Backtest:    OK"
          echo
          echo "KEIN LIVE TRADING"
          echo "KEINE API KEYS"
          echo "KEIN WALLET"
          echo "KEINE ECHTEN ORDERS"
          echo
          echo "============================================================"
