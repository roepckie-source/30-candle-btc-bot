name: 30-Kerzen BTC Bot - Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # Repository check
      # ------------------------------------------------------

      - name: Show repository files
        run: |
          echo "=== Repository ==="
          pwd
          echo
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort

      # ------------------------------------------------------
      # Config test
      # ------------------------------------------------------

      - name: Test config
        run: |
          echo "=== CONFIG TEST ==="
          python config.py

      # ------------------------------------------------------
      # Market data test
      # ------------------------------------------------------

      - name: Download and validate BTC 5m data
        run: |
          echo "=== MARKET DATA TEST ==="
          python market_data.py

      # ------------------------------------------------------
      # Check generated data
      # ------------------------------------------------------

      - name: Check generated CSV
        run: |
          echo "=== CSV CHECK ==="

          if [ -f "data/BTC_USD_5m.csv" ]; then
            echo "CSV gefunden."
            echo
            echo "Zeilen:"
            wc -l data/BTC_USD_5m.csv
            echo
            echo "Erste Zeilen:"
            head -5 data/BTC_USD_5m.csv
            echo
            echo "Letzte Zeilen:"
            tail -5 data/BTC_USD_5m.csv
          else
            echo "FEHLER: CSV wurde nicht erzeugt."
            exit 1
          fi
