name: 30-Kerzen BTC Bot Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow


      # ============================================================
      # 4. REPOSITORY CHECK
      # ============================================================

      - name: Repository check
        run: |
          echo "============================================================"
          echo "REPOSITORY CHECK"
          echo "============================================================"

          echo
          echo "Python files:"
          find . -maxdepth 3 -type f -name "*.py" | sort

          echo
          echo "Workflow files:"
          find .github -maxdepth 3 -type f | sort || true

          echo
          echo "Repository root:"
          ls -lah


      # ============================================================
      # 5. CONFIG TEST
      # ============================================================

      - name: Run config
        run: |
          echo "============================================================"
          echo "CONFIG"
          echo "============================================================"

          python config.py


      # ============================================================
      # 6. SIGNAL TEST
      # ============================================================

      - name: Run signal tests
        run: |
          echo "============================================================"
          echo "SIGNAL TESTS"
          echo "============================================================"

          python signals.py


      # ============================================================
      # 7. MARKET DATA
      # ============================================================

      - name: Download BTC 5m market data
        run: |
          echo "============================================================"
          echo "BTC 5M MARKET DATA"
          echo "============================================================"

          if [ -e "data" ] && [ ! -d "data" ]; then
            echo "FEHLER: 'data' existiert als Datei."
            echo "Bitte die Datei 'data' aus dem Repository entfernen."
            exit 1
          fi

          mkdir -p data

          python market_data.py


      # ============================================================
      # 8. CHECK BTC DATA
      # ============================================================

      - name: Check BTC data
        run: |
          echo "============================================================"
          echo "BTC CSV CHECK"
          echo "============================================================"

          if [ ! -f "data/BTC_USD_5m.csv" ]; then
            echo "FEHLER: data/BTC_USD_5m.csv fehlt."
            exit 1
          fi

          echo
          echo "Datei:"
          ls -lh data/BTC_USD_5m.csv

          echo
          echo "Zeilen:"
          wc -l data/BTC_USD_5m.csv

          echo
          echo "Erste Zeilen:"
          head -5 data/BTC_USD_5m.csv

          echo
          echo "Letzte Zeilen:"
          tail -5 data/BTC_USD_5m.csv


      # ============================================================
      # 9. HISTORICAL BACKTEST
      # ============================================================

      - name: Run historical backtest
        run: |
          echo "============================================================"
          echo "HISTORICAL BACKTEST"
          echo "============================================================"

          if [ ! -f "backtest.py" ]; then
            echo "FEHLER: backtest.py fehlt."
            exit 1
          fi

          python backtest.py


      # ============================================================
      # 10. HISTORICAL SIGNAL ANALYSIS
      # ============================================================

      - name: Run historical analysis
        run: |
          echo "============================================================"
          echo "HISTORICAL SIGNAL ANALYSIS"
          echo "============================================================"

          if [ ! -f "analysis.py" ]; then
            echo "FEHLER: analysis.py fehlt."
            exit 1
          fi

          python analysis.py


      # ============================================================
      # 11. FORWARD ANALYSIS
      # ============================================================

      - name: Run forward analysis
        run: |
          echo "============================================================"
          echo "FORWARD ANALYSIS"
          echo "============================================================"

          if [ ! -f "forward_analysis.py" ]; then
            echo "FEHLER: forward_analysis.py fehlt."
            exit 1
          fi

          python forward_analysis.py


      # ============================================================
      # 12. INDEPENDENT BACKTEST
      # ============================================================

      - name: Run independent backtest
        run: |
          echo "============================================================"
          echo "INDEPENDENT BACKTEST"
          echo "============================================================"

          if [ ! -f "independent_backtest.py" ]; then
            echo "FEHLER: independent_backtest.py fehlt."
            exit 1
          fi

          python independent_backtest.py


      # ============================================================
      # 13. POLYMARKET DATA DOWNLOAD
      # ============================================================

      - name: Download Polymarket BTC 5m dataset
        run: |
          echo "============================================================"
          echo "POLYMARKET BTC 5M DATASET"
          echo "============================================================"

          if [ ! -f "polymarket_btc5m_import.py" ]; then
            echo "FEHLER: polymarket_btc5m_import.py fehlt."
            exit 1
          fi

          python polymarket_btc5m_import.py


      # ============================================================
      # 14. POLYMARKET DATA INSPECTION
      # ============================================================

      - name: Inspect Polymarket dataset
        run: |
          echo "============================================================"
          echo "POLYMARKET DATASET INSPECTION"
          echo "============================================================"

          if [ ! -f "data/polymarket_btc5m.csv" ]; then
            echo "FEHLER: data/polymarket_btc5m.csv fehlt."
            exit 1
          fi

          echo
          echo "Datei:"
          ls -lh data/polymarket_btc5m.csv

          echo
          echo "Zeilen:"
          wc -l data/polymarket_btc5m.csv

          echo
          echo "Header:"
          head -1 data/polymarket_btc5m.csv

          echo
          echo "Erste 5 Datenzeilen:"
          head -6 data/polymarket_btc5m.csv


      # ============================================================
      # 15. POLYMARKET CSV CHECK
      # ============================================================

      - name: Check Polymarket CSV
        run: |
          echo "============================================================"
          echo "POLYMARKET CSV CHECK"
          echo "============================================================"

          if [ ! -f "data/polymarket_btc5m.csv" ]; then
            echo "FEHLER: data/polymarket_btc5m.csv fehlt."
            exit 1
          fi

          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/polymarket_btc5m.csv")

          with path.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              rows = list(reader)

          print(f"Rows: {len(rows):,}")

          if rows:
              print("Columns:")
              for column in rows[0].keys():
                  print(f"  {column}")

          print()
          print("CHECK OK")
          PY


      # ============================================================
      # 16. DOWNLOAD BTC DATA FOR POLYMARKET PERIOD
      # ============================================================

      - name: Download BTC data for Polymarket period
        run: |
          echo "============================================================"
          echo "BTC DATEN FÜR POLYMARKET ZEITRAUM"
          echo "============================================================"

          if [ ! -f "download_btc_polymarket_period.py" ]; then
            echo "FEHLER: download_btc_polymarket_period.py fehlt."
            echo
            echo "Vorhandene Python-Dateien:"
            find . -maxdepth 3 -type f -name "*.py" | sort
            exit 1
          fi

          python download_btc_polymarket_period.py


      # ============================================================
      # 17. CHECK BTC POLYMARKET PERIOD CSV
      # ============================================================

      - name: Check BTC Polymarket period CSV
        run: |
          echo "============================================================"
          echo "BTC POLYMARKET PERIOD CSV CHECK"
          echo "============================================================"

          if [ ! -f "data/BTC_USD_5m_polymarket_period.csv" ]; then
            echo "FEHLER: BTC Polymarket Zeitraum CSV fehlt."
            exit 1
          fi

          echo
          echo "Datei:"
          ls -lh data/BTC_USD_5m_polymarket_period.csv

          echo
          echo "Zeilen:"
          wc -l data/BTC_USD_5m_polymarket_period.csv

          echo
          echo "Erste Zeilen:"
          head -5 data/BTC_USD_5m_polymarket_period.csv

          echo
          echo "Letzte Zeilen:"
          tail -5 data/BTC_USD_5m_polymarket_period.csv


      # ============================================================
      # 18. POLYMARKET 26/30 SIGNAL ANALYSIS
      # ============================================================

      - name: Run Polymarket 26/30 signal analysis
        run: |
          echo "============================================================"
          echo "POLYMARKET 26/30 SIGNAL ANALYSE"
          echo "============================================================"

          if [ ! -f "polymarket_signal_analysis.py" ]; then
            echo "FEHLER: polymarket_signal_analysis.py fehlt."
            exit 1
          fi

          if [ ! -f "data/BTC_USD_5m_polymarket_period.csv" ]; then
            echo "FEHLER: BTC Polymarket Zeitraum CSV fehlt."
            exit 1
          fi

          if [ ! -f "data/polymarket_btc5m.csv" ]; then
            echo "FEHLER: Polymarket CSV fehlt."
            exit 1
          fi

          python polymarket_signal_analysis.py


      # ============================================================
      # 19. POLYMARKET BTC FORWARD ANALYSIS
      # ============================================================

      - name: Run Polymarket BTC forward analysis
        run: |
          echo "============================================================"
          echo "POLYMARKET BTC 26/30 FORWARD ANALYSE"
          echo "============================================================"

          if [ ! -f "polymarket_forward_btc_analysis.py" ]; then
            echo "FEHLER: polymarket_forward_btc_analysis.py fehlt."
            exit 1
          fi

          if [ ! -f "data/BTC_USD_5m_polymarket_period.csv" ]; then
            echo "FEHLER: BTC Polymarket Zeitraum CSV fehlt."
            exit 1
          fi

          python polymarket_forward_btc_analysis.py


      # ============================================================
      # 20. FINAL STATUS
      # ============================================================

      - name: Final status
        run: |
          echo
          echo "============================================================"
          echo "FINAL STATUS"
          echo "============================================================"

          echo
          echo "30-KERZEN BTC BOT"
          echo "-----------------"

          echo "Config:                         OK"
          echo "Signal Tests:                  OK"
          echo "BTC 5m Market Data:            OK"
          echo "Historical Backtest:           OK"
          echo "Historical Analysis:           OK"
          echo "Forward Analysis:              OK"
          echo "Independent Backtest:          OK"
          echo "Polymarket Dataset:            OK"
          echo "BTC Polymarket Period:         OK"
          echo "Polymarket 26/30 Analysis:     OK"
          echo "BTC Forward Analysis:          OK"

          echo
          echo "------------------------------------------------------------"
          echo "SICHERHEITSSTATUS"
          echo "------------------------------------------------------------"

          echo "PAPER TRADING ONLY"
          echo "KEIN LIVE TRADING"
          echo "KEINE API KEYS"
          echo "KEIN WALLET"
          echo "KEINE PRIVATEN SCHLÜSSEL"
          echo "KEINE ECHTEN ORDERS"

          echo
          echo "============================================================"
          echo "WORKFLOW ABGESCHLOSSEN"
          echo "============================================================"
