name: 30-Kerzen BTC Bot - Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow


      # ============================================================
      # 4. REPOSITORY CHECK
      # ============================================================

      - name: Show repository files
        run: |
          echo "============================================================"
          echo "REPOSITORY CHECK"
          echo "============================================================"

          pwd

          echo
          echo "Dateien und Ordner:"
          find . -maxdepth 3 -printf "%y %p\n" | sort


      # ============================================================
      # 5. DATA PFAD PRÜFEN
      # ============================================================

      - name: Check data path
        run: |
          echo "============================================================"
          echo "DATA PFAD CHECK"
          echo "============================================================"

          echo "Aktuelles Verzeichnis:"
          pwd

          echo
          echo "Prüfung data:"

          if [ -e "data" ]; then
            echo "data existiert."

            if [ -d "data" ]; then
              echo "data ist ein ORDNER."
            else
              echo "FEHLER: data ist KEIN ORDNER."
              ls -la data
              exit 1
            fi
          else
            echo "data existiert noch nicht."
          fi


      # ============================================================
      # 6. DATA ORDNER VORBEREITEN
      # ============================================================

      - name: Prepare data directory
        run: |
          echo "============================================================"
          echo "DATA ORDNER VORBEREITEN"
          echo "============================================================"

          mkdir -p data

          echo
          echo "data:"
          ls -ld data

          echo
          echo "Inhalt:"
          ls -la data


      # ============================================================
      # 7. CONFIG TEST
      # ============================================================

      - name: Test config
        run: |
          echo "============================================================"
          echo "CONFIG TEST"
          echo "============================================================"

          python config.py


      # ============================================================
      # 8. SIGNAL TEST
      # ============================================================

      - name: Test signals
        run: |
          echo "============================================================"
          echo "SIGNAL TEST"
          echo "============================================================"

          python signals.py


      # ============================================================
      # 9. BTC MARKET DATA
      # ============================================================

      - name: Download and validate BTC 5m data
        run: |
          echo "============================================================"
          echo "BTC 5m MARKTDATEN"
          echo "============================================================"

          python market_data.py


      # ============================================================
      # 10. BTC CSV CHECK
      # ============================================================

      - name: Check generated BTC CSV
        run: |
          echo "============================================================"
          echo "BTC CSV CHECK"
          echo "============================================================"

          if [ -f "data/BTC_USD_5m.csv" ]; then

            echo "CSV gefunden."

            echo
            echo "Datei:"
            ls -lh data/BTC_USD_5m.csv

            echo
            echo "Zeilen:"
            wc -l data/BTC_USD_5m.csv

            echo
            echo "Erste Zeilen:"
            head -5 data/BTC_USD_5m.csv

            echo
            echo "Letzte Zeilen:"
            tail -5 data/BTC_USD_5m.csv

          else

            echo "FEHLER: BTC CSV wurde nicht erzeugt."

            echo
            echo "Inhalt data/:"
            ls -la data

            exit 1

          fi


      # ============================================================
      # 11. HISTORISCHER BACKTEST
      # ============================================================

      - name: Run historical backtest
        run: |
          echo "============================================================"
          echo "HISTORISCHER BACKTEST"
          echo "============================================================"

          if [ ! -f "backtest.py" ]; then
            echo "FEHLER: backtest.py wurde nicht gefunden."
            exit 1
          fi

          python backtest.py


      # ============================================================
      # 12. HISTORISCHE ANALYSE
      # ============================================================

      - name: Run historical analysis
        run: |
          echo "============================================================"
          echo "HISTORISCHE ANALYSE"
          echo "============================================================"

          if [ ! -f "analysis.py" ]; then
            echo "FEHLER: analysis.py wurde nicht gefunden."
            exit 1
          fi

          python analysis.py


      # ============================================================
      # 13. FORWARD ANALYSIS
      # ============================================================

      - name: Run forward return analysis
        run: |
          echo "============================================================"
          echo "FORWARD ANALYSIS"
          echo "============================================================"

          if [ ! -f "forward_analysis.py" ]; then
            echo "FEHLER: forward_analysis.py wurde nicht gefunden."
            exit 1
          fi

          python forward_analysis.py


      # ============================================================
      # 14. 2 / 3 / 5 / 10 KERZEN BACKTEST
      # ============================================================

      - name: Run 2/3/5/10 candle series backtest
        run: |
          echo "============================================================"
          echo "2 / 3 / 5 / 10 KERZEN BACKTEST"
          echo "============================================================"

          if [ ! -f "independent_backtest.py" ]; then
            echo "FEHLER: independent_backtest.py wurde nicht gefunden."

            echo
            echo "Vorhandene Python-Dateien:"
            find . -maxdepth 3 -type f -name "*.py" | sort

            exit 1
          fi

          python independent_backtest.py


      # ============================================================
      # 15. POLYMARKET BTC 5m DATASET HERUNTERLADEN
      # ============================================================

      - name: Download Polymarket BTC 5m dataset
        run: |
          echo "============================================================"
          echo "POLYMARKET BTC 5m DATASET"
          echo "============================================================"

          mkdir -p data

          curl -fL \
            "https://github.com/Filip303/Polymarket/raw/refs/heads/main/data/sii_exec_matrix_btc5m.parquet" \
            -o data/sii_exec_matrix_btc5m.parquet

          echo
          echo "Download abgeschlossen."

          echo
          echo "Datei:"
          ls -lh data/sii_exec_matrix_btc5m.parquet

          echo
          echo "Dateityp:"
          file data/sii_exec_matrix_btc5m.parquet


      # ============================================================
      # 16. POLYMARKET DATASET PRÜFEN
      # ============================================================

      - name: Inspect Polymarket BTC 5m dataset
        run: |
          echo "============================================================"
          echo "POLYMARKET DATASET INSPEKTION"
          echo "============================================================"

          if [ ! -f "data/sii_exec_matrix_btc5m.parquet" ]; then
            echo "FEHLER: Parquet-Datei fehlt."
            exit 1
          fi

          if [ ! -f "polymarket_btc5m_import.py" ]; then
            echo "FEHLER: polymarket_btc5m_import.py fehlt."

            echo
            echo "Vorhandene Python-Dateien:"
            find . -maxdepth 3 -type f -name "*.py" | sort

            exit 1
          fi

          python polymarket_btc5m_import.py


      # ============================================================
      # 17. POLYMARKET CSV CHECK
      # ============================================================

      - name: Check Polymarket CSV
        run: |
          echo "============================================================"
          echo "POLYMARKET CSV CHECK"
          echo "============================================================"

          if [ -f "data/polymarket_btc5m.csv" ]; then

            echo "Polymarket CSV gefunden."

            echo
            echo "Datei:"
            ls -lh data/polymarket_btc5m.csv

            echo
            echo "Zeilen:"
            wc -l data/polymarket_btc5m.csv

            echo
            echo "Erste Zeilen:"
            head -5 data/polymarket_btc5m.csv

            echo
            echo "Letzte Zeilen:"
            tail -5 data/polymarket_btc5m.csv

          else

            echo "FEHLER: Polymarket CSV wurde nicht erzeugt."

            echo
            echo "Inhalt data/:"
            ls -la data

            exit 1

          fi


      # ============================================================
      # 18. ABSCHLUSS
      # ============================================================

      - name: Final status
        run: |
          echo
          echo "============================================================"
          echo "30-KERZEN BTC BOT - GESAMTTEST"
          echo "============================================================"
          echo
          echo "Config:                       OK"
          echo "Signals:                      OK"
          echo "BTC Market Data:              OK"
          echo "BTC CSV:                      OK"
          echo "Backtest:                     OK"
          echo "Historical Analysis:          OK"
          echo "Forward Analysis:             OK"
          echo "2/3/5/10 Candle Backtest:    OK"
          echo "Polymarket Dataset:           OK"
          echo "Polymarket Import:            OK"
          echo
          echo "============================================================"
          echo "PAPER TRADING ONLY"
          echo "============================================================"
          echo
          echo "KEIN LIVE TRADING"
          echo "KEINE API KEYS"
          echo "KEIN WALLET"
          echo "KEINE PRIVATEN SCHLÜSSEL"
          echo "KEINE ECHTEN ORDERS"
          echo
          echo "============================================================"
